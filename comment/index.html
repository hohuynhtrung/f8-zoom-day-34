<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment System</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
      }
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }
      .loading {
        font-size: 1.1rem;
        color: #555;
        font-weight: 500;
        margin-top: 30px;
      }
      .comment-box {
        background: white;
        width: 100%;
        max-width: 600px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        padding: 25px;
        margin-top: 30px;
      }
      h3 {
        margin-top: 0;
        color: #333;
        border-bottom: 2px solid #f0f2f5;
        padding-bottom: 10px;
      }
      /* Style Form */
      .comment-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 30px;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
      }
      .form-group {
        display: flex;
        gap: 10px;
      }
      .form-group input {
        flex: 1;
      }
      input,
      textarea {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.95rem;
        font-family: inherit;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #007bff;
      }
      .submit-btn {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        align-self: flex-end;
        transition: 0.2s;
      }
      .submit-btn:hover {
        background: #0056b3;
      }
      /* Style List Comment */
      .comment-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .comment-item {
        display: flex;
        gap: 15px;
        align-items: flex-start;
      }
      .avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      .comment-content {
        flex: 1;
        background: #f0f2f5;
        padding: 12px 15px;
        border-radius: 12px;
        position: relative;
      }
      .comment-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
      }
      .comment-name {
        font-weight: 600;
        color: #1c1e21;
        font-size: 0.95rem;
      }
      .comment-email {
        font-size: 0.8rem;
        color: #65676b;
        font-weight: normal;
      }
      .comment-time {
        font-size: 0.8rem;
        color: #8a8d91;
      }
      .comment-body {
        color: #050505;
        font-size: 0.95rem;
        line-height: 1.4;
        word-break: break-word;
        margin-top: 10px;
      }
      .back {
        display: block;
        margin-top: 30px;
        text-align: center;
        color: #666;
        text-decoration: none;
      }
      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.21.4/babel.min.js"></script>
    <script type="text/babel">
      function Comment() {
        const [comments, setComments] = React.useState([]);
        const [loading, setLoading] = React.useState(true);

        const [formData, setFormData] = React.useState({
          name: "",
          email: "",
          body: "",
        });

        React.useEffect(() => {
          fetch("https://jsonplaceholder.typicode.com/comments?postId=1")
            .then((response) => response.json())
            .then((data) => {
              const fakeTimeComments = data.map((item, index) => {
                const hoursAgo = (index + 1) * 5;
                return {
                  ...item,
                  time:
                    hoursAgo > 24
                      ? `${Math.floor(hoursAgo / 24)} day ago`
                      : `${hoursAgo} hours ago`,
                };
              });
              setTimeout(() => {
                setComments(fakeTimeComments);
                setLoading(false);
              }, 1000);
            })
            .catch((error) => {
              console.error("Error call API:", error);
              setLoading(false);
            });
        }, []);

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData({
            ...formData,
            [name]: value,
          });
        };

        const handleSubmit = (e) => {
          e.preventDefault();

          if (
            !formData.name.trim() ||
            !formData.email.trim() ||
            !formData.body.trim()
          ) {
            alert("Please fill in all the information!");
            return;
          }

          const newComment = {
            if: Date.now(),
            name: formData.name,
            email: formData.email,
            body: formData.body,
            time: "just now",
          };

          setComments([newComment, ...comments]);
          setFormData({ name: "", email: "", body: "" });
        };
        return (
          <div className="page-container">
            <a href="../index.html" className="back">
              ← Back to Menu
            </a>
            <div className="comment-box">
              <h3>Comment</h3>
              <form className="comment-form" onSubmit={handleSubmit}>
                <div className="form-group">
                  <input
                    type="text"
                    name="name"
                    placeholder="Your name..."
                    value={formData.name}
                    onChange={handleInputChange}
                  />
                  <input
                    type="email"
                    name="email"
                    placeholder="Your email..."
                    value={formData.email}
                    onChange={handleInputChange}
                  />
                </div>
                <textarea
                  name="body"
                  placeholder="Enter your comment here..."
                  value={formData.body}
                  onChange={handleInputChange}
                ></textarea>
                <button type="submit" className="submit-btn">
                  Send
                </button>
              </form>
              {loading ? (
                <div className="loading">Loading comments…</div>
              ) : (
                <div className="comment-list">
                  {comments.map((comment) => (
                    <div className="comment-item" key={comment.id}>
                      <img
                        className="avatar"
                        src={`https://ui-avatars.com/api/?name=${encodeURIComponent(comment.name)}&background=random`}
                        alt="avatar"
                      />
                      <div className="comment-content">
                        <div className="comment-header">
                          <span className="comment-name">{comment.name}</span>
                          <span className="comment-time">{comment.time}</span>
                        </div>
                        <span className="comment-email">{comment.email}</span>
                        <div className="comment-body">{comment.body}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Comment />);
    </script>
  </body>
</html>
