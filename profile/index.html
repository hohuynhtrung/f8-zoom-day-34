<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile App</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
      }
      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
      }
      .loading {
        font-size: 1.2rem;
        color: #555;
        font-weight: 500;
        margin-top: 40px;
      }
      .user-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        width: 100%;
        max-width: 1200px;
        margin-top: 30px;
      }
      .profile-card {
        background: white;
        width: 380px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        margin-top: 30px;
      }
      .card-header {
        background: linear-gradient(135deg, #007bff, #0056b3);
        padding: 30px 20px;
        text-align: center;
        color: white;
      }
      .card-header h2 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
      }
      .card-header p {
        margin: 5px 0 0 0;
        opacity: 0.8;
        font-size: 1rem;
      }
      .card-body {
        padding: 24px;
      }
      .info-item {
        display: flex;
        margin-bottom: 15px;
        border-bottom: 1px solid #f0f0f0;
        padding-bottom: 10px;
      }
      .info-item:last-child {
        margin-bottom: 0;
        border-bottom: none;
        padding-bottom: 0;
      }
      .label {
        font-weight: 600;
        color: #4a5568;
        width: 100px;
        flex-shrink: 0;
      }
      .value {
        color: #2d3748;
        word-break: break-word;
      }
      .back {
        display: block;
        margin-top: 25px;
        text-align: center;
        color: #666;
        text-decoration: none;
        font-size: 0.95rem;
      }
      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.21.4/babel.min.js"></script>
    <script type="text/babel">
      function Profile() {
        const [users, setUsers] = React.useState(null);
        const [loading, setLoading] = React.useState(true);
        React.useEffect(() => {
          fetch("https://jsonplaceholder.typicode.com/users")
            .then((response) => response.json())
            .then((data) => {
              setTimeout(() => {
                setUsers(data);
                setLoading(false);
              }, 1000);
            })
            .catch((error) => {
              console.error("Error call API", error);
              setLoading(false);
            });
        }, []);
        return (
          <div className="page-container">
            <a href="../index.html" className="back">
              ← Back to Menu
            </a>
            {loading ? (
              <div className="loading">Loading...</div>
            ) : (
              <div className="user-grid">
                {users.map((user) => (
                  <div className="profile-card">
                    <div className="card-header">
                      <h2>{user.name}</h2>
                      <p>{user.username}</p>
                    </div>
                    <div className="card-body">
                      <div className="info-item">
                        <span className="label">Email:</span>
                        <span className="value">{user.email}</span>
                      </div>
                      <div className="info-item">
                        <span className="label">Phone:</span>
                        <span className="value">{user.phone}</span>
                      </div>
                      <div className="info-item">
                        <span className="label">Website:</span>
                        <span className="value">{user.website}</span>
                      </div>
                      <div className="info-item">
                        <span className="label">Address:</span>
                        <span className="value">
                          {user.address.street}, {user.address.city}
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Profile />);
    </script>
  </body>
</html>
