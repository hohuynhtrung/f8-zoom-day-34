<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
      }

      .page-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .loading {
        font-size: 18px;
        color: #007bff;
        font-weight: 600;
        margin-top: 60px;
        animation: pulse 1.5s infinite;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        width: 100%;
        max-width: 1200px;
        margin-top: 25px;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        padding: 20px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .product-id {
        font-size: 0.85rem;
        font-weight: 700;
        color: #007bff;
        background: #e6f2ff;
        padding: 4px 8px;
        border-radius: 4px;
        align-self: flex-start;
        margin-bottom: 12px;
      }

      .product-card h3 {
        margin: 0 0 10px 0;
        font-size: 1.15rem;
        color: #1a1a1a;
        line-height: 1.4;
      }

      .product-card p {
        font-size: 0.95rem;
        color: #555;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }

      .detail-btn {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background 0.2s;
        width: 100%;
        text-align: center;
      }

      .detail-btn:hover {
        background: #0056b3;
      }

      .back {
        display: block;
        margin-bottom: 15px;
        color: #666;
        text-decoration: none;
        font-weight: 500;
      }

      .back:hover {
        text-decoration: underline;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        animation: fadeIn 0.3s ease;
      }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 16px;
        max-width: 550px;
        width: 90%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        position: relative;
        animation: slideUp 0.3s ease;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 28px;
        background: none;
        border: none;
        color: #aaa;
        cursor: pointer;
        transition: color 0.2s;
      }

      .close-btn:hover {
        color: #333;
      }

      .modal-content h2 {
        margin-top: 10px;
        color: #1a1a1a;
        font-size: 1.4rem;
      }

      .modal-content p {
        color: #444;
        font-size: 1rem;
        line-height: 1.6;
        margin-top: 15px;
      }

      /* Animations */
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.21.4/babel.min.js"></script>

    <script type="text/babel">
      function Product() {
        const [products, setProducts] = React.useState(null);
        const [loading, setLoading] = React.useState(true);

        const [activeProduct, setActiveProduct] = React.useState(null);

        React.useEffect(() => {
          fetch("https://jsonplaceholder.typicode.com/posts?_limit=12")
            .then((response) => response.json())
            .then((data) => {
              setTimeout(() => {
                setProducts(data);
                setLoading(false);
              }, 800);
            })
            .catch((error) => {
              console.error("Error call API:", error);
              setLoading(false);
            });
        }, []);

        const capitalizeFirstLetter = (string) => {
          if (!string) return "";
          return string.charAt(0).toUpperCase() + string.slice(1);
        };

        const truncateBody = (text) => {
          if (text.length <= 100) return text;
          return text.substring(0, 100) + "...";
        };

        return (
          <div className="page-container">
            <a href="../index.html" className="back">
              ← Back to Menu
            </a>

            {loading ? (
              <div className="loading">Loading products...</div>
            ) : (
              <div className="product-grid">
                {products.map((product) => (
                  <div className="product-card" key={product.id}>
                    <div>
                      <span className="product-id">ID: {product.id}</span>
                      <h3>{capitalizeFirstLetter(product.title)}</h3>
                      <p>{truncateBody(product.body)}</p>
                    </div>
                    <button
                      className="detail-btn"
                      onClick={() => setActiveProduct(product)}
                    >
                      View detail
                    </button>
                  </div>
                ))}
              </div>
            )}

            {activeProduct && (
              <div
                className="modal-overlay"
                onClick={() => setActiveProduct(null)}
              >
                <div
                  className="modal-content"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    className="close-btn"
                    onClick={() => setActiveProduct(null)}
                  >
                    &times;
                  </button>
                  <h2>{capitalizeFirstLetter(activeProduct.title)}</h2>
                  <p>{activeProduct.body}</p>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Product />);
    </script>
  </body>
</html>
